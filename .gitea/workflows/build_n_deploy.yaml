name: Gitea Actions Package Build
run-name: ${{ gitea.actor }} 🚀
on:
  push:
    tags:
      - 'v*'

jobs:
  docker_build:
    env:
      ROS_DISTRO: humble
      DOCKER_REGISTRY: 381491853486.dkr.ecr.us-east-1.amazonaws.com/ironbrain
      
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-latest

    steps:
      - name: Print Release Info
        run: echo "Release created ${{ github.event.release.tag_name }}"
              
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY  }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY_SECRET }}
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry: 381491853486.dkr.ecr.us-east-1.amazonaws.com
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push amd64
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          file: ros2.pytorch.amd64.Dockerfile
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-cache,mode=max
          build-args: |
            BASE_IMAGE=nvcr.io/nvidia/cuda:12.2.2-cudnn8-devel-ubuntu22.04
            ROS_DISTRO=${{ env.ROS_DISTRO }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-amd64            
          context: .
          push: true      
  
      - name: Build and Push arm64
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: ros2.pytorch.aarch64.Dockerfile
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-cache,mode=max
          build-args: |
            BASE_IMAGE=ultralytics/ultralytics:latest-jetson-jetpack6            
            ROS_DISTRO=${{ env.ROS_DISTRO }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-aarch64                 
          context: .
          push: true

      - name: merge images latest
        run: |
          docker buildx imagetools create \
          -t ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0 \
          ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-amd64 \
          ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-aarch64

      - name: cleanup
        run: |
          docker rmi ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-amd64
          docker rmi ${{ env.DOCKER_REGISTRY }}/ros2.pytorch:${{ env.ROS_DISTRO }}-pytorch2.3.0-aarch64